# Optional, free, self-hosted web search for OMOS research. OMOS works fully
# without it; you only need this if you want web research.
#
# Setup (creates config/searxng/.env with a private random secret):
#   python scripts/setup_searxng.py
# Start:   docker compose -f config/searxng/docker-compose.yml up -d
# Then start OMOS with WEB_SEARCH_URL=http://127.0.0.1:8888/search
#
# Bound to 127.0.0.1 only: never expose this port to your network.
# SearXNG itself sends your search terms to public search engines.
services:
  searxng:
    # Pinned to a reviewed release and its digest (no moving "latest").
    # To update: pick a newer dated tag, check its digest, edit both parts.
    image: searxng/searxng:2026.10.19-81371861f@sha256:5ed0323b5f5f8701264ef65e239a2bd83cb57098f2b971fa30bf79c06eeae271
    container_name: omos-searxng
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      # Compose refuses to start when this is missing, so a shared or
      # placeholder secret can never be used by accident.
      - SEARXNG_SECRET=${SEARXNG_SECRET:?run python scripts/setup_searxng.py first}
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
