# Optional, free, self-hosted web search for OMOS research.
# Start:   docker compose -f config/searxng/docker-compose.yml up -d
# Then set WEB_SEARCH_URL=http://127.0.0.1:8888/search before starting OMOS.
# Bound to 127.0.0.1 only: never expose this port to your network.
services:
  searxng:
    image: searxng/searxng:latest
    container_name: omos-searxng
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
