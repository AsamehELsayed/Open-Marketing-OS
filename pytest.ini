[pytest]
norecursedirs = development/worktrees .dogfood-scratch .reproof-scratch build dist
testpaths = app/tests

# DEV-008: markers are declared so `--strict-markers` can be enabled without a
# typo silently becoming a no-op. `slow` marks the launcher end-to-end test that
# starts a real server; `windows` marks tests that only pass on Windows.
#
# Nothing is deselected by default. The end-to-end launcher test is the only
# test that proves the real backend boots and seeds a workspace, so it runs in
# the default suite. Select subsets explicitly instead:
#     pytest -m "not slow"     # skip the server test
#     pytest -m slow           # only the server test
markers =
    slow: starts a real server or performs real I/O
    windows: only meaningful on Windows (DPAPI, DPAPI-backed credential vault)
